name: Build Android Debug APK

on:
  push:
    branches: [V2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/V2'
    name: Build downloadable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Build debug APK for physical Android phones
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cricket-prediction-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add download and testing instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Debug APK ready
          Download the `cricket-prediction-debug` artifact from this run and unzip it.
          Install `app-debug.apk` on an ARM Android phone (Android 7.0 or later).

          This debug APK uses Metro and the local backend on your Mac:
          1. From `backend/`, configure `.env` and run `npm run dev`.
          2. From the repository root, run `npm start` in another terminal.
          3. Connect the phone with USB debugging enabled, then run:
             ```bash
             adb reverse tcp:8081 tcp:8081
             adb reverse tcp:3000 tcp:3000
             adb install -r app-debug.apk
             ```
          4. Open the installed app. Keep Metro and the backend running.

          Only ADB platform tools are needed on your Mac; Android Studio and the
          Android build SDK are not needed. If the Play Store version is installed,
          its signature differs: uninstall it before installing this debug APK.
          Uninstalling clears local app data.
          SUMMARY
