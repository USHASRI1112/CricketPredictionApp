name: Build Android Release APK and AAB

on:
  push:
    branches: [V2]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Optional backend HTTPS URL; defaults to the production URL in the app'
        required: false
        type: string
      version_code:
        description: 'Optional version code override; defaults to the version in android/app/build.gradle'
        required: false
        type: string
      version_name:
        description: 'User-visible version name (for example 1.0.2)'
        required: true
        type: string
        default: '1.0.2'

permissions:
  contents: read

concurrency:
  group: android-release-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/V2'
    name: Build standalone release APK and signed AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate release inputs and configure production backend
        env:
          BACKEND_URL: ${{ inputs.backend_url || vars.RELEASE_BACKEND_URL || secrets.RELEASE_BACKEND_URL }}
          VERSION_CODE: ${{ inputs.version_code || vars.RELEASE_VERSION_CODE || secrets.RELEASE_VERSION_CODE }}
          VERSION_NAME: ${{ inputs.version_name || vars.RELEASE_VERSION_NAME || secrets.RELEASE_VERSION_NAME || '1.0.2' }}
        run: |
          node .github/scripts/configure-android-release.cjs

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path
          required = ['KEYSTORE_BASE64', 'MYAPP_UPLOAD_STORE_PASSWORD',
                      'MYAPP_UPLOAD_KEY_ALIAS', 'MYAPP_UPLOAD_KEY_PASSWORD']
          for name in required:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing signing secret: {name}')
          data = base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True)
          if not data:
              raise SystemExit('Upload keystore is empty')
          path = Path(os.environ['RUNNER_TEMP']) / 'upload-keystore.jks'
          path.write_bytes(data)
          path.chmod(0o600)
          PY

      - name: Build standalone release APK and AAB
        working-directory: android
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ env.RELEASE_VERSION_CODE }}
          ORG_GRADLE_PROJECT_APP_VERSION_NAME: ${{ env.RELEASE_VERSION_NAME }}
        run: bash ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2

      - name: Verify release signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature.txt"
          cat "$RUNNER_TEMP/aab-signature.txt"
          grep -q 'jar verified\.' "$RUNNER_TEMP/aab-signature.txt"

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: cricket-prediction-release-apk-${{ env.RELEASE_VERSION_CODE }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: cricket-prediction-release-aab-${{ env.RELEASE_VERSION_CODE }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Add download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Standalone release APK and AAB ready
          Two artifacts are available:
          - Unzip the `release-apk` artifact and install `app-release.apk` directly on your phone.
          - Unzip the `release-aab` artifact and upload `app-release.aab` to Play Console.

          Both builds include JavaScript and use the production HTTPS backend.
          No Metro, local backend, ADB port forwarding, or Android Studio is needed to use the APK.
          A previously installed debug APK or Play Store app may use a different signing certificate;
          uninstall it before sideloading if Android reports a signature conflict. This clears local app data.
          This workflow builds artifacts only; it does not publish to Google Play.
          SUMMARY
